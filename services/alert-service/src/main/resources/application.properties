# Application Configurations
spring.application.name=alert-service
server.port=8081
spring.profiles.active=ingestor
server.servlet.context-path=/api

# Kafka Core Configurations
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=5000

# Kafka Processor Groups
alerts.kafka.processor-group=alert-processor

# Kafka Topics
alerts.kafka.raw-topic=raw-alerts
alerts.kafka.outbox-event-topic=outbox-event-topic

alerts.outbox.poll-interval-ms=30000

# JDBC
spring.datasource.url=jdbc:postgresql://localhost:5432/alert_service
spring.datasource.username=alert_app
spring.datasource.password=local_dev_password
